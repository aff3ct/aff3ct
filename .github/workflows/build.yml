name: Build

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ "**" ]

defaults:
  run:
    shell: bash

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard GCC
          - compiler: gcc-x64-sse4.2
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_gcc:v9.3.0
            cflags_spe: "-m64 -msse4.2"
            prec: "MULTI"
            lflags: "-static -static-libgcc -static-libstdc++ -Wl,--whole-archive -lrt -lpthread -Wl,--no-whole-archive"
            cmake_opt_spe: ""
            cc: gcc
            cxx: g++
          
          # GCC Opt variants
          - compiler: gcc-nointr
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_gcc:v9.3.0
            cflags_spe: "-DMIPP_NO_INTRINSICS"
            prec: "MULTI"
            lflags: "-static -static-libgcc -static-libstdc++ -Wl,--whole-archive -lrt -lpthread -Wl,--no-whole-archive"
            cmake_opt_spe: ""
            cc: gcc
            cxx: g++

          - compiler: gcc-x64-avx2
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_gcc:v9.3.0
            cflags_spe: "-m64 -mavx2 -mfma"
            prec: "MULTI"
            lflags: "-static -static-libgcc -static-libstdc++ -Wl,--whole-archive -lrt -lpthread -Wl,--no-whole-archive"
            cmake_opt_spe: ""
            cc: gcc
            cxx: g++

          - compiler: gcc-8-bit
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_gcc:v9.3.0
            cflags_spe: "-march=native"
            prec: "8"
            lflags: ""
            cmake_opt_spe: "-DAFF3CT_LINK_GSL=ON"
            cc: gcc
            cxx: g++

          # GCC MPI
          - compiler: gcc-mpi
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_openmpi:v4.0.3
            cflags_spe: "-march=native"
            prec: "MULTI"
            lflags: ""
            cmake_opt_spe: "-DAFF3CT_LINK_GSL=ON -DAFF3CT_MPI=ON"
            cmake_opt_lib: "-DAFF3CT_COMPILE_STATIC_LIB=OFF -DAFF3CT_COMPILE_SHARED_LIB=OFF"
            cc: gcc
            cxx: g++

          # Clang
          - compiler: clang
            image: registry.gitlab.com/aff3ct/aff3ct/x86_64_ubuntu_clang:v10.0.0
            cflags_spe: "-Wall -Wno-overloaded-virtual -funroll-loops"
            prec: "MULTI"
            lflags: ""
            cmake_opt_spe: "-DAFF3CT_LINK_GSL=ON"
            cc: clang
            cxx: clang++

          # ICPC
          - compiler: icpc
            image: intel/oneapi-hpckit:2022.2-devel-ubuntu20.04
            cflags_spe: "-Wall -funroll-loops -march=native -std=c++11"
            prec: "MULTI"
            lflags: ""
            cmake_opt_spe: "-DAFF3CT_LINK_GSL=OFF -DAFF3CT_LINK_MKL=ON"
            cc: icc
            cxx: icpc

    container: ${{ matrix.image }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CFLAGS: "-Wall -funroll-loops ${{ matrix.cflags_spe }}"
      LFLAGS: ${{ matrix.lflags }}
      CMAKE_OPT: "-DAFF3CT_COMPILE_EXE=ON ${{ matrix.cmake_opt_lib || '-DAFF3CT_COMPILE_STATIC_LIB=ON -DAFF3CT_COMPILE_SHARED_LIB=ON' }} -DAFF3CT_PREC=${{ matrix.prec }} -DAFF3CT_EXT_STRINGS=OFF ${{ matrix.cmake_opt_spe }}"
      NAME: build_linux_${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
      
      - name: Update submodules with fallback
        run: ./ci/tools/update-submodules.sh

      - name: Prepare environment
        run: apt-get update || true; apt-get install -y pkg-config

      - name: Build Linux
        run: |
          source ./ci/tools/threads.sh
          ./ci/build-linux-macos.sh
          
      - uses: actions/upload-artifact@v4
        with:
          name: build-linux-${{ matrix.compiler }}
          path: ${{ env.NAME }}
          retention-days: 7

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - compiler: msvc-avx
            prec: "MULTI"
            cflags_spe: "-D_CRT_SECURE_NO_DEPRECATE /MT /EHsc /arch:AVX"
    env:
      CFLAGS: "${{ matrix.cflags_spe }}"
      CMAKE_OPT: "-DAFF3CT_COMPILE_EXE=ON -DAFF3CT_COMPILE_STATIC_LIB=ON -DAFF3CT_COMPILE_SHARED_LIB=ON -DAFF3CT_PREC=${{ matrix.prec }} -DAFF3CT_EXT_STRINGS=OFF -DSPU_STACKTRACE=OFF"
      NAME: build_windows_${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          
      - name: Update submodules with fallback
        shell: bash
        run: ./ci/tools/update-submodules.sh

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install getopt-win32:x64-windows

      - name: Build Windows
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_CXX_FLAGS="${CFLAGS} /MP" -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" ${CMAKE_OPT} -DCMAKE_INSTALL_PREFIX="${NAME}"
          cmake --build . --config Release --parallel ${NUMBER_OF_PROCESSORS}

      - uses: actions/upload-artifact@v4
        with:
          name: build-windows-${{ matrix.compiler }}
          path: build
          retention-days: 7

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - compiler: clang
            prec: "MULTI"
    env:
      CC: clang
      CXX: clang++
      CFLAGS: "-Wall -funroll-loops"
      CMAKE_OPT: "-DAFF3CT_COMPILE_EXE=ON -DAFF3CT_COMPILE_STATIC_LIB=ON -DAFF3CT_COMPILE_SHARED_LIB=ON -DAFF3CT_PREC=${{ matrix.prec }} -DAFF3CT_EXT_STRINGS=OFF"
      NAME: build_macos_${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false
          
      - name: Update submodules with fallback
        run: ./ci/tools/update-submodules.sh

      - name: Build macOS
        run: |
          source ./ci/tools/threads.sh
          ./ci/build-linux-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.compiler }}
          path: ${{ env.NAME }}
          retention-days: 7

  # ============================================================================
  # ALL-GREEN (single stable required status check for branch protection)
  # ============================================================================
  # Require only this job on 'develop' instead of each build-matrix leaf above.
  # It fails only when a build job failed or was cancelled, so compilers can be
  # added/removed/renamed in the matrix without touching branch protection.
  build-all-green:
    name: build-all-green
    needs: [build-linux, build-windows, build-macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required build jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Upstream job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required build job did not succeed (result: $r)"
              exit 1
            fi
          done
          echo "All required build jobs passed (skipped jobs are tolerated)."

